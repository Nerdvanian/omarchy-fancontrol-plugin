# Omarchy Fan Control curves.
# Edited via the fan-control graph panel -- the daemon hot-reloads
# this file on save.
poll_interval_s: 2
curves:
- name: nct6793_pwm1
  sensor:
    chip: coretemp
    label: Package id 0
  pwm:
    chip: nct6793
    index: 1
    fan_index: 1
  hysteresis_c: 3.0
  points:
  - - 30.0
    - 20.0
  - - 50.0
    - 35.0
  - - 65.0
    - 55.0
  - - 80.0
    - 100
  manual_percent: null
  label: Top Exhaust
  gpu:
    points:
    - - 30.0
      - 20.0
    - - 50.0
      - 30.0
    - - 70.0
      - 60.0
    - - 85.0
      - 100
    hysteresis_c: 3.0
- name: nct6793_pwm2
  sensor:
    chip: coretemp
    label: Package id 0
  pwm:
    chip: nct6793
    index: 2
    fan_index: 2
  hysteresis_c: 3.0
  points:
  - - 30.0
    - 20.0
  - - 50.0
    - 35.0
  - - 65.0
    - 55.0
  - - 80.0
    - 100
  manual_percent: null
  label: AIO Fan
- name: nct6793_pwm3
  sensor:
    chip: coretemp
    label: Package id 0
  pwm:
    chip: nct6793
    index: 3
    fan_index: 3
  hysteresis_c: 3.0
  points:
  - - 30.0
    - 20.0
  - - 50.0
    - 35.0
  - - 65.0
    - 55.0
  - - 80.0
    - 100
  manual_percent: null
  label: Front Intake
- name: nct6793_pwm6
  sensor:
    chip: coretemp
    label: Package id 0
  pwm:
    chip: nct6793
    index: 6
    fan_index: 6
  hysteresis_c: 3.0
  points:
  - - 30.0
    - 20.0
  - - 50.0
    - 35.0
  - - 65.0
    - 55.0
  - - 80.0
    - 100
  manual_percent: null
  label: Back Exhaust
